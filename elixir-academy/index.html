<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Elixir 炼金术学院 · 零基础交互式课堂</title>
  <meta name="description" content="面向零基础的 Elixir 交互式学习平台：在浏览器里直接写代码、立刻看到结果，闯关式解锁六个阶段。">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧪</text></svg>">

<body>

  <header class="topbar">
    <button class="icon-btn" id="btnMenu" title="课程目录">☰</button>

      <span class="flask">🧪</span>
      <span>
        Elixir 炼金术学院
        <small>零基础 · 浏览器里直接写代码</small>

    </div>

    <div class="spacer"></div>

    <div class="progress-wrap">
      <div class="progress-bar"><i id="pgBar"></i></div>
      <span class="progress-num" id="pgNum">0%</span>

  <!-- ================= 主体 ================= -->
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="content" id="content"></main>

  <!-- ================= 引擎 ================= -->
  <script src="assets/js/engine/lexer.js"></script>

  <script src="data/stages-a.js"></script>
  <script src="data/stages-b.js"></script>
  <script src="data/curriculum.js"></script>

  <script src="assets/js/editor.js"></script>

</html>
